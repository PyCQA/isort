---
name: CI

"on":
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  DEFAULT_PYTHON: "3.14"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - &checkout
        name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - &setup-python
        name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          check-latest: true

      - &setup-uv
        name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Lint
        run: uv run --with tox-uv tox -e lint

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    name: "Tests (Python: ${{ matrix.python-version }}, OS: ${{ matrix.os }})"
    env:
      FORCE_COLOR: 1

    steps:
      - *checkout
     
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          check-latest: true

      - *setup-uv
      
      - name: Install dependencies (non-compiled)
        env:
          HATCH_BUILD_HOOK_ENABLE_MYPYC: false
        run: uv sync --all-extras --frozen

      - name: Run tests (non-compiled)
        run: uv run --with tox-uv tox -e py,coverage_report-ci

      - name: Report Coverage
        uses: codecov/codecov-action@v7

      - name: Install dependencies (compiled)
        env:
          HATCH_BUILD_HOOK_ENABLE_MYPYC: true
        run: uv sync --all-extras --frozen --reinstall-package isort

      - name: Run tests (compiled)
        env:
          HATCH_BUILD_HOOK_ENABLE_MYPYC: true
          COVERAGE_FAIL_UNDER: 0
        run: uv run --with tox-uv tox --recreate -e py,coverage_report-ci


  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-python
      - *setup-uv

      - name: Install dependencies (compiled)
        env:
            HATCH_BUILD_HOOK_ENABLE_MYPYC: true
        run: uv sync --all-extras --frozen

      - name: Test integration
        run: ./scripts/test_integration.sh
